# Codemagic CI/CD Configuration for METR Mobile
# Ultimate configuration with comprehensive build, test, and deployment workflows

workflows:
  # Android Release Build Workflow
  android-release:
    name: METR Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - codemagic_android # Contains ANDROID_SIGNING_KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
        - codemagic_android_credentials # Contains GOOGLE_SERVICE_ACCOUNT_CREDENTIALS, GOOGLE_PLAY_TRACK
        - codemagic_env # Contains any custom environment variables
      # Android signing: Using environment variables from codemagic_android group
      # Alternative: Configure keystore in Codemagic UI (Settings → Android → Signing) 
      # and uncomment the line below with the correct keystore reference name
      # android_signing:
      #   - your_keystore_reference_name
      vars:
        PACKAGE_NAME: "com.metr.mobile"
        APP_NAME: "METR"
        NODE_VERSION: "18.20.0"
        JAVA_VERSION: "17"
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Xmx4096m"
        ANDROID_BUILD_TOOLS: "31.0.0"
        ANDROID_COMPILE_SDK: "33"
        ANDROID_TARGET_SDK: "31"
        ANDROID_MIN_SDK: "24"
    scripts:
      - name: Set up environment
        script: |
          set -e
          echo "🚀 Setting up METR Android build environment..."
          
          # Set up Node.js (Codemagic has Node.js pre-installed)
          echo "📦 Checking Node.js version..."
          node --version
          npm --version
          
          # Note: Codemagic provides Node.js pre-installed
          # Using system Node.js (Codemagic default)
          
          # Set up Java
          echo "☕ Setting up Java ${JAVA_VERSION}..."
          export JAVA_HOME=$(/usr/libexec/java_home -v ${JAVA_VERSION})
          java -version
          
          # Set up Android SDK
          echo "🤖 Setting up Android SDK..."
          export ANDROID_HOME=$HOME/Library/Android/sdk
          export PATH=$PATH:$ANDROID_HOME/emulator
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          export PATH=$PATH:$ANDROID_HOME/tools
          export PATH=$PATH:$ANDROID_HOME/tools/bin
          
          # Accept Android licenses
          yes | sdkmanager --licenses || true
          
          # Install required Android SDK components
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
          
          echo "✅ Environment setup complete"
      - name: Install dependencies
        script: |
          set -e
          echo "📥 Installing dependencies..."
          
          # Clean install
          npm ci --ignore-scripts
          
          # Apply patches
          echo "🔧 Applying patches..."
          npx patch-package || echo "⚠️ No patches to apply"
          
          # Run postinstall scripts
          echo "🔨 Running postinstall scripts..."
          npm run postinstall || echo "⚠️ Postinstall completed with warnings"
          
          echo "✅ Dependencies installed"
      - name: Generate assets and i18n files
        script: |
          set -e
          echo "🎨 Generating assets and i18n files..."
          
          # Ensure dist directory exists
          mkdir -p dist/assets
          
          # Generate assets (this creates dist/assets/ from assets/base/)
          node scripts/generate-assets.js
          
          # Verify i18n files exist
          if [ ! -f "dist/assets/i18n/en.json" ]; then
            echo "❌ ERROR: dist/assets/i18n/en.json not found after asset generation!"
            echo "Creating fallback i18n directory..."
            mkdir -p dist/assets/i18n
            cp -r assets/base/i18n/* dist/assets/i18n/ || true
          fi
          
          # List generated i18n files
          echo "📋 Generated i18n files:"
          ls -la dist/assets/i18n/ || echo "⚠️ i18n directory not found"
          
          echo "✅ Assets generated successfully"
      - name: Setup Compass Icons
        script: |
          set -e
          echo "🎯 Setting up Compass Icons..."
          
          COMPASS_ICONS="node_modules/@mattermost/compass-icons/font/compass-icons.ttf"
          if [ -f "$COMPASS_ICONS" ]; then
            mkdir -p assets/fonts
            mkdir -p android/app/src/main/assets/fonts
            cp "$COMPASS_ICONS" "assets/fonts/"
            cp "$COMPASS_ICONS" "android/app/src/main/assets/fonts"
            echo "✅ Compass Icons configured"
          else
            echo "⚠️ Compass Icons font not found at $COMPASS_ICONS"
          fi
      - name: Run linting and type checking
        script: |
          set -e
          echo "🔍 Running code quality checks..."
          
          # Linting
          echo "Running ESLint..."
          npm run lint || echo "⚠️ Linting completed with warnings"
          
          # Type checking
          echo "Running TypeScript type check..."
          npm run tsc || echo "⚠️ Type checking completed with warnings"
          
          echo "✅ Code quality checks complete"
      - name: Run tests
        script: |
          set -e
          echo "🧪 Running tests..."
          
          npm test -- --coverage --watchAll=false || echo "⚠️ Tests completed with warnings"
          
          echo "✅ Tests complete"
      - name: Setup Android signing
        script: |
          set -e
          echo "🔐 Setting up Android signing..."
          
          # Decode base64 keystore to file
          if [ -n "$ANDROID_SIGNING_KEYSTORE" ]; then
            echo "Decoding keystore from environment variable..."
            echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > android/app/release.keystore
            
            # Set environment variables for Gradle (relative to android/app/)
            export MATTERMOST_RELEASE_STORE_FILE="release.keystore"
            export MATTERMOST_RELEASE_PASSWORD="$KEYSTORE_PASSWORD"
            export MATTERMOST_RELEASE_KEY_ALIAS="$KEY_ALIAS"
            
            echo "✅ Keystore decoded and environment variables set"
            echo "Keystore location: android/app/release.keystore"
          else
            echo "⚠️ WARNING: ANDROID_SIGNING_KEYSTORE not set. Build will be unsigned."
            echo "Set ANDROID_SIGNING_KEYSTORE in codemagic_android environment group."
          fi
      - name: Build Android Release Bundle (AAB)
        script: |
          set -e
          echo "🔨 Building Android Release Bundle..."
          
          cd android
          
          # Clean previous builds
          ./gradlew clean
          
          # Build release bundle
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="${GRADLE_OPTS}" \
            -Dkotlin.daemon.jvm.options="${GRADLE_OPTS}"
          
          # Verify AAB was created
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
            echo "✅ AAB built successfully: $AAB_PATH ($AAB_SIZE)"
          else
            echo "❌ ERROR: AAB not found at $AAB_PATH"
            exit 1
          fi
          
          cd ..
      - name: Build Android Release APK (optional)
        script: |
          set -e
          echo "📦 Building Android Release APK..."
          
          cd android
          
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="${GRADLE_OPTS}" \
            -Dkotlin.daemon.jvm.options="${GRADLE_OPTS}"
          
          # Verify APK was created
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APK built successfully: $APK_PATH ($APK_SIZE)"
          else
            echo "⚠️ APK not found at $APK_PATH"
          fi
          
          cd ..
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - ticev15897@fantastu.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GOOGLE_SERVICE_ACCOUNT_CREDENTIALS
        # Track: Use one of: 'internal', 'alpha', 'beta', 'production'
        # Option 1: Use direct value (recommended for now)
        track: internal
        # Option 2: Use environment variable from codemagic_android_credentials group
        # If you set GOOGLE_PLAY_TRACK in codemagic_android_credentials group, 
        # uncomment the line below and comment out the track: internal line above
        # track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true

  # Android Debug Build Workflow
  android-debug:
    name: METR Android Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - codemagic_env
      vars:
        PACKAGE_NAME: "com.metr.mobile"
        APP_NAME: "METR"
        NODE_VERSION: "18.20.0"
        JAVA_VERSION: "17"
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4096m"
    scripts:
      - name: Set up environment
        script: |
          set -e
          echo "🚀 Setting up METR Android Debug build environment..."
          
          # Set up Node.js (Codemagic has Node.js pre-installed)
          echo "📦 Checking Node.js version..."
          node --version
          npm --version
          
          # Note: Codemagic provides Node.js pre-installed
          # Using system Node.js (Codemagic default)
          
          # Set up Java
          export JAVA_HOME=$(/usr/libexec/java_home -v ${JAVA_VERSION})
          java -version
          
          # Set up Android SDK
          export ANDROID_HOME=$HOME/Library/Android/sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses || true
      - name: Install dependencies
        script: |
          set -e
          npm ci --ignore-scripts
          npx patch-package || true
          npm run postinstall || true
      - name: Generate assets
        script: |
          set -e
          mkdir -p dist/assets
          node scripts/generate-assets.js
          mkdir -p dist/assets/i18n
          cp -r assets/base/i18n/* dist/assets/i18n/ || true
      - name: Generate debug keystore
        script: |
          set -e
          echo "🔐 Generating debug keystore..."
          
          # Ensure Java is available for keytool
          export JAVA_HOME=$(/usr/libexec/java_home -v ${JAVA_VERSION})
          
          # Generate debug keystore if it doesn't exist
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Creating debug keystore..."
            cd android/app
            keytool -genkeypair \
              -v -storetype PKCS12 \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            cd ../..
            echo "✅ Debug keystore created at android/app/debug.keystore"
          else
            echo "✅ Debug keystore already exists at android/app/debug.keystore"
          fi
      - name: Build Debug APK
        script: |
          set -e
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
    artifacts:
      - android/app/build/outputs/**/*.apk

  # iOS Release Build Workflow
  ios-release:
    name: METR iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_ios # App Store Connect integration name configured in Codemagic UI
    environment:
      groups:
        - codemagic_ios # Contains APP_STORE_CONNECT_KEY_IDENTIFIER, ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
        - codemagic_certificates # Contains CERTIFICATE_PRIVATE_KEY, CERTIFICATE_PASSWORD
        - codemagic_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.metr.mobile
      vars:
        PACKAGE_NAME: "com.metr.mobile"
        APP_NAME: "METR"
        NODE_VERSION: "18.20.0"
        XCODE_VERSION: "15.0"
        COCOAPODS_VERSION: "1.15.2"
    scripts:
      - name: Set up environment
        script: |
          set -e
          echo "🚀 Setting up METR iOS build environment..."
          
          # Set up Node.js (Codemagic has Node.js pre-installed)
          echo "📦 Checking Node.js version..."
          node --version
          npm --version
          
          # Note: Codemagic provides Node.js pre-installed
          # Using system Node.js (Codemagic default)
          
          # Set up CocoaPods
          gem install cocoapods -v ${COCOAPODS_VERSION}
          pod --version
          
          echo "✅ Environment setup complete"
      - name: Install dependencies
        script: |
          set -e
          echo "📥 Installing dependencies..."
          
          npm ci --ignore-scripts
          npx patch-package || true
          
          # Install iOS gems
          cd ios
          bundle install
          cd ..
          
          # Install CocoaPods
          cd ios
          bundle exec pod install --repo-update
          cd ..
          
          # Run postinstall
          npm run postinstall || true
          
          echo "✅ Dependencies installed"
      - name: Generate assets and i18n files
        script: |
          set -e
          echo "🎨 Generating assets and i18n files..."
          
          mkdir -p dist/assets
          node scripts/generate-assets.js
          
          if [ ! -f "dist/assets/i18n/en.json" ]; then
            echo "Creating fallback i18n directory..."
            mkdir -p dist/assets/i18n
            cp -r assets/base/i18n/* dist/assets/i18n/ || true
          fi
          
          echo "✅ Assets generated"
      - name: Setup Compass Icons
        script: |
          set -e
          COMPASS_ICONS="node_modules/@mattermost/compass-icons/font/compass-icons.ttf"
          if [ -f "$COMPASS_ICONS" ]; then
            mkdir -p assets/fonts
            cp "$COMPASS_ICONS" "assets/fonts/"
            echo "✅ Compass Icons configured"
          fi
      - name: Run linting and type checking
        script: |
          set -e
          npm run lint || true
          npm run tsc || true
      - name: Run tests
        script: |
          set -e
          npm test -- --coverage --watchAll=false || true
      - name: Build iOS Release IPA
        script: |
          set -e
          echo "🔨 Building iOS Release IPA..."
          
          xcodebuild \
            -workspace ios/Mattermost.xcworkspace \
            -scheme Mattermost \
            -configuration Release \
            -archivePath build/Mattermost.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
          
          # Build IPA from archive
          xcodebuild \
            -exportArchive \
            -archivePath build/Mattermost.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            | xcpretty
          
          echo "✅ IPA built successfully"
    artifacts:
      - build/ipa/*.ipa
      - build/*.dSYM.zip
    publishing:
      email:
        recipients:
          - ticev15897@fantastu.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration # Uses the integration configured in 'integrations' section above
        submit_to_testflight: true
        # Beta groups: Add your TestFlight beta group names here (optional)
        # Uncomment and add your beta group names if you want to automatically add builds to specific groups
        # beta_groups:
        #   - "Internal Testers"
        #   - "Beta Testers"

  # iOS Debug Build Workflow
  ios-debug:
    name: METR iOS Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - codemagic_env
      vars:
        NODE_VERSION: "18.20.0"
        COCOAPODS_VERSION: "1.15.2"
    scripts:
      - name: Set up environment
        script: |
          set -e
          echo "🚀 Setting up METR iOS Debug build environment..."
          
          # Set up Node.js (Codemagic has Node.js pre-installed)
          echo "📦 Checking Node.js version..."
          node --version || echo "Node.js not found"
          
          # Try to use system Node.js (Codemagic default) or install if needed
          if [ -f "$HOME/.nvm/nvm.sh" ]; then
            source "$HOME/.nvm/nvm.sh"
            nvm install ${NODE_VERSION} || echo "Using system Node.js"
            nvm use ${NODE_VERSION} || echo "Using system Node.js"
          else
            echo "Using system Node.js (Codemagic default)"
          fi
          
          # Set up CocoaPods
          gem install cocoapods -v ${COCOAPODS_VERSION}
      - name: Install dependencies
        script: |
          set -e
          npm ci --ignore-scripts
          npx patch-package || true
          cd ios && bundle install && bundle exec pod install && cd ..
          npm run postinstall || true
      - name: Generate assets
        script: |
          set -e
          mkdir -p dist/assets
          node scripts/generate-assets.js
          mkdir -p dist/assets/i18n
          cp -r assets/base/i18n/* dist/assets/i18n/ || true
      - name: Build Debug IPA
        script: |
          set -e
          xcodebuild \
            -workspace ios/Mattermost.xcworkspace \
            -scheme Mattermost \
            -configuration Debug \
            -archivePath build/Mattermost-Debug.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.ipa
      - build/**/*.app

  # Test and Quality Check Workflow
  test-and-quality:
    name: METR Test & Quality
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - codemagic_env
      vars:
        NODE_VERSION: "18.20.0"
    scripts:
      - name: Set up environment
        script: |
          set -e
          echo "🚀 Setting up METR Test & Quality environment..."
          
          # Set up Node.js (Codemagic has Node.js pre-installed)
          echo "📦 Checking Node.js version..."
          node --version || echo "Node.js not found"
          
          # Try to use system Node.js (Codemagic default) or install if needed
          if [ -f "$HOME/.nvm/nvm.sh" ]; then
            source "$HOME/.nvm/nvm.sh"
            nvm install ${NODE_VERSION} || echo "Using system Node.js"
            nvm use ${NODE_VERSION} || echo "Using system Node.js"
          else
            echo "Using system Node.js (Codemagic default)"
          fi
          
          node --version
          npm --version
      - name: Install dependencies
        script: |
          set -e
          npm ci --ignore-scripts
          npx patch-package || true
      - name: Generate assets
        script: |
          set -e
          mkdir -p dist/assets
          node scripts/generate-assets.js
          mkdir -p dist/assets/i18n
          cp -r assets/base/i18n/* dist/assets/i18n/ || true
      - name: Run linting
        script: |
          set -e
          echo "🔍 Running ESLint..."
          npm run lint
      - name: Run type checking
        script: |
          set -e
          echo "📝 Running TypeScript type check..."
          npm run tsc
      - name: Run tests
        script: |
          set -e
          echo "🧪 Running tests with coverage..."
          npm test -- --coverage --watchAll=false
      - name: Check i18n
        script: |
          set -e
          echo "🌍 Checking i18n files..."
          ./scripts/precommit/i18n.sh || echo "⚠️ i18n check completed with warnings"
    artifacts:
      - coverage/**
      - test-results/**

  # E2E Tests Workflow
  e2e-tests:
    name: METR E2E Tests
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - codemagic_env
      vars:
        NODE_VERSION: "18.20.0"
    scripts:
      - name: Set up environment
        script: |
          set -e
          echo "🚀 Setting up METR E2E Tests environment..."
          
          # Set up Node.js (Codemagic has Node.js pre-installed)
          echo "📦 Checking Node.js version..."
          node --version || echo "Node.js not found"
          
          # Try to use system Node.js (Codemagic default) or install if needed
          if [ -f "$HOME/.nvm/nvm.sh" ]; then
            source "$HOME/.nvm/nvm.sh"
            nvm install ${NODE_VERSION} || echo "Using system Node.js"
            nvm use ${NODE_VERSION} || echo "Using system Node.js"
          else
            echo "Using system Node.js (Codemagic default)"
          fi
          
          node --version
          npm --version
      - name: Install dependencies
        script: |
          set -e
          npm ci --ignore-scripts
          npx patch-package || true
      - name: Generate assets
        script: |
          set -e
          mkdir -p dist/assets
          node scripts/generate-assets.js
          mkdir -p dist/assets/i18n
          cp -r assets/base/i18n/* dist/assets/i18n/ || true
      - name: Run Android E2E tests
        script: |
          set -e
          echo "🤖 Running Android E2E tests..."
          npm run e2e:android || echo "⚠️ E2E tests completed with warnings"
      - name: Run iOS E2E tests
        script: |
          set -e
          echo "🍎 Running iOS E2E tests..."
          npm run e2e:ios || echo "⚠️ E2E tests completed with warnings"
    artifacts:
      - detox/**/*.xml
      - detox/**/*.png

# Global configuration
workflow_id: android-release # Default workflow to run
app_id: your-codemagic-app-id # Replace with your Codemagic app ID

