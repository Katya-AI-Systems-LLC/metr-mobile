# CircleCI Configuration for METR
version: 2.1

orbs:
  node: circleci/node@5.0.0
  android: circleci/android@2.0.0

jobs:
  lint:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - node/install-packages
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Type Check
          command: npm run type-check

  test:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - node/install-packages
      - run:
          name: Run Tests
          command: npm test -- --coverage
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage

  build-android:
    docker:
      - image: cimg/android:2023.01.1
    steps:
      - checkout
      - android/restore-gradle-cache
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Build Debug APK
          command: cd android && ./gradlew assembleDebug
      - android/save-gradle-cache
      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk

workflows:
  version: 2
  build-and-test:
    jobs:
      - lint
      - test
      - build-android:
          requires:
            - lint
            - test
          filters:
            branches:
              only:
                - main
                - develop
