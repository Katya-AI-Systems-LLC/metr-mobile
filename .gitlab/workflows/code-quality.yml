# GitLab Code Quality
code_quality:
  stage: test
  image: node:18-alpine
  script:
    - npm ci
    - npm run lint
    - npm run type-check
    - npm run complexity:check
  artifacts:
    reports:
      codequality: code-quality-report.json
  only:
    - merge_requests
    - main
  tags:
    - quality


