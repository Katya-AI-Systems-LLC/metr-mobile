version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "metr-team"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "metr-team"
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for Gradle
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    reviewers:
      - "metr-team"
    labels:
      - "dependencies"
      - "android"

  # Enable version updates for CocoaPods
  - package-ecosystem: "cocoapods"
    directory: "/ios"
    schedule:
      interval: "weekly"
    reviewers:
      - "metr-team"
    labels:
      - "dependencies"
      - "ios"


